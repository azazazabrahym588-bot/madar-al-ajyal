<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القائمة | مدار الأجيال</title>
    <style>
        :root {
            --primary: #0A2A6B;
            --secondary: #1EA7F0;
            --gold: #F2B21B;
            --bg: #F8FAFC;
            --text: #1E293B;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .menu-container {
            background: var(--primary);
            color: white;
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .menu-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .menu-header h2 { font-size: 24px; color: white; margin-bottom: 5px; }
        .menu-header p { font-size: 14px; color: var(--secondary); }
        
        .menu-list {
            list-style: none;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            color: white;
            font-weight: bold;
            background: rgba(255,255,255,0.05);
        }
        
        .menu-item:hover {
            background: rgba(255,255,255,0.15);
            border-right: 4px solid var(--gold);
            transform: translateX(-5px);
        }
        
        .menu-icon {
            font-size: 20px;
            width: 30px;
            text-align: center;
        }
        
        .badge {
            background: var(--gold);
            color: var(--primary);
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: auto;
        }
        
        .logout-btn {
            margin-top: 30px;
            background: rgba(220, 38, 38, 0.2);
            color: #fca5a5;
        }
        .logout-btn:hover {
            background: #dc2626;
            color: white;
            border-right: 4px solid white;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <div class="menu-header">
            <h2>مدار الأجيال</h2>
            <p>القائمة الرئيسية</p>
        </div>

        <ul class="menu-list">
            <a href="index.html" class="menu-item">
                <span class="menu-icon">🏠</span>
                <span>الصفحة الرئيسية</span>
            </a>
            
            <a href="dashboard.html" class="menu-item">
                <span class="menu-icon">📊</span>
                <span>لوحة التحكم</span>
            </a>
            
            <a href="admin.html" class="menu-item">
                <span class="menu-icon">👨‍🏫</span>
                <span>لوحة المشرف / المدرس</span>
            </a>
            
            <a href="owner.html" class="menu-item">
                <span class="menu-icon">👑</span>
                <span>لوحة مالك المنصة</span>
                <span class="badge">خاص</span>
            </a>
            
            <a href="register.html" class="menu-item">
                <span class="menu-icon">📝</span>
                <span>تسجيل مؤسسة جديدة</span>
            </a>

            <a href="#" onclick="logout(event)" class="menu-item logout-btn">
                <span class="menu-icon">🚪</span>
                <span>تسجيل الخروج</span>
            </a>
        </ul>
    </div>

    <script>
        // دالة بسيطة لتسجيل الخروج
        async function logout(e) {
            e.preventDefault();
            // سيتم تفعيلها عندما نربط القائمة بقاعدة البيانات
            alert("سيتم تسجيل الخروج (هذه القائمة للتنقل السريع فقط حالياً).");
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
