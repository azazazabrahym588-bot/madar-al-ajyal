<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل مؤسسة جديدة | مدار الأجيال</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #0A2A6B;
            --secondary: #1EA7F0;
            --gold: #F2B21B;
            --bg: #F8FAFC;
            --text: #1E293B;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .register-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            border-top: 5px solid var(--secondary);
        }
        .logo-header { text-align: center; margin-bottom: 30px; }
        .logo-header h2 { color: var(--primary); font-size: 28px; margin-bottom: 5px; }
        .logo-header p { color: #666; font-size: 14px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--primary); }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--secondary);
            outline: none;
            box-shadow: 0 0 5px rgba(30, 167, 240, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover { background: var(--secondary); }
        
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; }
        .login-link a { color: var(--secondary); text-decoration: none; font-weight: bold; }

        .message { padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 20px; display: none; font-weight: bold; }
        .message.error { background: #fee2e2; color: #dc2626; display: block; }
        .message.success { background: #dcfce7; color: #16a34a; display: block; }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="logo-header">
            <h2>مدار الأجيال</h2>
            <p>تسجيل مؤسسة جديدة</p>
        </div>

        <div id="messageBox" class="message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>اسم المؤسسة (المدرسة/الجامعة/المعهد)</label>
                <input type="text" id="instName" required placeholder="مثال: مدرسة النور الأهلية">
            </div>

            <div class="form-group">
                <label>نوع المؤسسة</label>
                <select id="instType" required>
                    <option value="">-- اختر النوع --</option>
                    <option value="مدرسة">مدرسة</option>
                    <option value="جامعة">جامعة</option>
                    <option value="معهد">معهد</option>
                </select>
            </div>

            <div class="form-group">
                <label>الاسم الكامل للمدير (مالك الحساب)</label>
                <input type="text" id="adminName" required placeholder="اسمك الثلاثي">
            </div>

            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="example@domain.com">
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required placeholder="********" minlength="6">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">إنشاء الحساب</button>
        </form>

        <div class="login-link">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>

    <script>
        // ⚠️ هنا ضع مفاتيحك التي استخرجتها من Supabase
        const supabaseUrl = 'https://xxvvgbjtwofabjeuqfjg.supabase.co'
        const supabaseAnonKey = 'sb_publishable_jr4Xk71vLgEGNq1FJrnl6g_xdF-JcaT'

        const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

        const form = document.getElementById('registerForm');
        const msgBox = document.getElementById('messageBox');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.innerText = 'جاري التسجيل...';
            btn.disabled = true;
            msgBox.style.display = 'none';

            const instName = document.getElementById('instName').value;
            const instType = document.getElementById('instType').value;
            const adminName = document.getElementById('adminName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // 1. إنشاء حساب المستخدم في Supabase
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { full_name: adminName }
                    }
                });

                if (authError) throw authError;

                // 2. إضافة المؤسسة وربطها بالمستخدم
                const { data: instData, error: instError } = await supabase
                    .from('institutions')
                    .insert([
                        { name: instName, type: instType, owner_id: authData.user.id }
                    ])
                    .select()
                    .single();

                if (instError) throw instError;

                // 3. تحديث الملف الشخصي لربط المؤسسة
                const { error: profileError } = await supabase
                    .from('profiles')
                    .update({ institution_id: instData.id, role: 'owner' })
                    .eq('id', authData.user.id);

                if (profileError) throw profileError;

                msgBox.className = 'message success';
                msgBox.innerText = 'تم تسجيل المؤسسة بنجاح! جاري تحويلك للوحة التحكم...';
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);

            } catch (error) {
                msgBox.className = 'message error';
                msgBox.innerText = 'حدث خطأ: ' + error.message;
                btn.innerText = 'إنشاء الحساب';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
